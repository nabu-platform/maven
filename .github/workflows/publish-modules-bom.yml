name: Publish Modules BOM

on:
  workflow_dispatch:
    inputs:
      bomVersion:
        description: Published version for modules-bom
        required: true
        default: 1.0-SNAPSHOT

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-modules-bom
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Check out poms repository
        uses: actions/checkout@v4
        with:
          repository: nabu-platform/poms
          path: poms

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configure Maven GitHub server
        shell: bash
        run: |
          cat > "$HOME/.m2/settings.xml" <<'EOF'
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate modules BOM from latest published packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/generate_bom.py \
            --source poms/modules.xml \
            --output modules-bom.xml \
            --owner nabu-platform \
            --bom-artifact-id modules-bom \
            --bom-version "${{ inputs.bomVersion }}"

      - name: Publish modules BOM
        run: >-
          mvn -B deploy:deploy-file
          -Durl=https://maven.pkg.github.com/nabu-platform/maven
          -DrepositoryId=github
          -Dfile=modules-bom.xml
          -DpomFile=modules-bom.xml
          -Dpackaging=pom
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
