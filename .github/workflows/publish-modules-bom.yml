name: Publish Modules BOM

on:
  workflow_dispatch:
    inputs:
      bomVersion:
        description: Floating published version for modules-bom/projects parent
        required: true
        default: 1.0-SNAPSHOT
      releaseVersion:
        description: Concrete published version for modules-bom/projects parent
        required: true
        default: 1.0-SNAPSHOT.20260622135217

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-modules-bom
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Check out poms repository
        uses: actions/checkout@v4
        with:
          repository: nabu-platform/poms
          path: poms

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configure Maven GitHub server
        shell: bash
        run: |
          cat > "$HOME/.m2/settings.xml" <<'EOF'
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish module releases to GitHub Maven
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/publish_module_releases.py \
            --source poms/modules-bom.xml \
            --state modules-state.json \
            --owner nabu-platform \
            --include nabu:maven-plugin-install:jar \
            --include nabu:maven-plugin-environment:jar

      - name: Generate concrete modules BOM from latest published packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/generate_bom.py \
            --source poms/modules-bom.xml \
            --output modules-bom-release.xml \
            --owner nabu-platform \
            --state modules-state.json \
            --bom-artifact-id modules-bom \
            --bom-version "${{ inputs.releaseVersion }}"

      - name: Publish concrete modules BOM
        run: >-
          mvn -B deploy:deploy-file
          -Durl=https://maven.pkg.github.com/nabu-platform/maven
          -DrepositoryId=github
          -Dfile=modules-bom-release.xml
          -DpomFile=modules-bom-release.xml
          -Dpackaging=pom
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate floating modules BOM alias
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/generate_bom.py \
            --source poms/modules-bom.xml \
            --output modules-bom.xml \
            --owner nabu-platform \
            --state modules-state.json \
            --bom-artifact-id modules-bom \
            --bom-version "${{ inputs.bomVersion }}"

      - name: Publish floating modules BOM alias
        run: >-
          mvn -B deploy:deploy-file
          -Durl=https://maven.pkg.github.com/nabu-platform/maven
          -DrepositoryId=github
          -Dfile=modules-bom.xml
          -DpomFile=modules-bom.xml
          -Dpackaging=pom
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate concrete projects parent POM
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/generate_modules_parent.py \
            --output projects-release.xml \
            --version "${{ inputs.releaseVersion }}" \
            --bom-version "${{ inputs.releaseVersion }}" \
            --owner nabu-platform

      - name: Publish concrete projects parent POM
        run: >-
          mvn -B deploy:deploy-file
          -Durl=https://maven.pkg.github.com/nabu-platform/maven
          -DrepositoryId=github
          -Dfile=projects-release.xml
          -DpomFile=projects-release.xml
          -Dpackaging=pom
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate floating projects parent alias
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/generate_modules_parent.py \
            --output projects.xml \
            --version "${{ inputs.bomVersion }}" \
            --bom-version "${{ inputs.bomVersion }}" \
            --owner nabu-platform

      - name: Publish floating projects parent alias
        run: >-
          mvn -B deploy:deploy-file
          -Durl=https://maven.pkg.github.com/nabu-platform/maven
          -DrepositoryId=github
          -Dfile=projects.xml
          -DpomFile=projects.xml
          -Dpackaging=pom
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
