name: Publish Core BOM

on:
  workflow_dispatch:
    inputs:
      bomVersion:
        description: Floating published version for core-bom
        required: true
        default: 1.0-SNAPSHOT
      releaseVersion:
        description: Concrete published version for core-bom
        required: true
        default: 1.0-SNAPSHOT.20260623170000

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-core-bom
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Check out poms repository
        uses: actions/checkout@v4
        with:
          repository: nabu-platform/poms
          path: poms

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configure Maven GitHub server
        shell: bash
        run: |
          cat > "$HOME/.m2/settings.xml" <<'EOF'
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish core releases to GitHub Maven
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/publish_core_releases.py \
            --source poms/core-bom.xml \
            --state core-state.json \
            --owner nabu-platform

      - name: Generate concrete core BOM from latest published packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/generate_bom.py \
            --source poms/core-bom.xml \
            --output core-bom-release.xml \
            --owner nabu-platform \
            --state core-state.json \
            --bom-artifact-id core-bom \
            --bom-version "${{ inputs.releaseVersion }}"

      - name: Publish concrete core BOM
        run: >-
          mvn -B deploy:deploy-file
          -Durl=https://maven.pkg.github.com/nabu-platform/maven
          -DrepositoryId=github
          -Dfile=core-bom-release.xml
          -DpomFile=core-bom-release.xml
          -Dpackaging=pom
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate floating core BOM alias
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/generate_bom.py \
            --source poms/core-bom.xml \
            --output core-bom.xml \
            --owner nabu-platform \
            --state core-state.json \
            --bom-artifact-id core-bom \
            --bom-version "${{ inputs.bomVersion }}"

      - name: Publish floating core BOM alias
        run: >-
          mvn -B deploy:deploy-file
          -Durl=https://maven.pkg.github.com/nabu-platform/maven
          -DrepositoryId=github
          -Dfile=core-bom.xml
          -DpomFile=core-bom.xml
          -Dpackaging=pom
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
